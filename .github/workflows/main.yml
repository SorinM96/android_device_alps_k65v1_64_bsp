name: Build TWRP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Device Tree
      uses: actions/checkout@v3
      with:
        path: device/alps/k65v1_64_bsp

    - name: Free Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo docker image prune -a -f

    - name: Install Build Tools
      run: |
        sudo apt-get update
        sudo apt sudo apt install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev libc6-dev-i386 libncurses-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3update
       
    - name: Install Repo Tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Initialize TWRP Manifest
      run: |
        mkdir -p ~/twrp
        cd ~/twrp
        git config --global user.name "SorinM96"
        git config --global user.email "sorin@example.com"
        repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1
        repo sync -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    - name: Copy Device Tree
      run: |
        mkdir -p ~/twrp/device/alps/k65v1_64_bsp
        cp -r device/alps/k65v1_64_bsp/* ~/twrp/device/alps/k65v1_64_bsp/

    - name: Build Recovery
      run: |
        cd ~/twrp
        source build/envsetup.sh
        lunch omni_k65v1_64_bsp-eng || lunch twrp_k65v1_64_bsp-eng
        mka recoveryimage -j$(nproc --all)

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TWRP-k65v1_64_bsp
        path: ~/twrp/out/target/product/k65v1_64_bsp/recovery.img
